name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # The core library on its own: no backends, no third party dependencies besides Catch2.
  core:
    name: Core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC,     os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: Linux Clang,   os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: macOS Clang,   os: macos-latest,   cc: clang, cxx: clang++ }
          - { name: Windows MSVC,  os: windows-latest }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRATUI_BUILD_TESTS=ON -DRATUI_INSTALL=OFF

      # TEMPORARY: the default Release flags plus a PDB, for the crash stack trace below.
      - name: Configure (Windows, with symbols)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build -DRATUI_BUILD_TESTS=ON -DRATUI_INSTALL=OFF
          "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi"
          "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # TEMPORARY: the stack of a crashing test, and a dump to open in Visual Studio.
      - name: Crash stack trace (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe  = "build/Tests/Release/RatUI_Tests.exe"
          $test = "ScrollContainerWidget: clicks reach the row under the pointer once scrolled"

          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if ( Test-Path $cdb ) {
            # Stops at the first access violation, prints the registers and stack, and quits.
            Set-Content cdb.txt -Encoding ascii -Value 'sxe -c ".lastevent; r; kn 50; q" av', 'g'
            & $cdb -lines -G -y "build/Tests/Release" -cf cdb.txt $exe $test
          } else {
            Write-Host "cdb not found: see the dump artifact."
          }

          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip procdump
          New-Item -ItemType Directory dumps | Out-Null
          ./procdump/procdump64.exe -accepteula -ma -e 1 -f C0000005 -x dumps $exe $test
          Copy-Item build/Tests/Release/RatUI_Tests.exe, build/Tests/Release/RatUI_Tests.pdb dumps

      - name: Upload crash dump (Windows)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: crash-dump-windows
          path: dumps
          if-no-files-found: warn

  # Every backend plus the examples app, with dependencies fetched where they are not installed.
  backends:
    name: Backends + Examples (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows MSVC, os: windows-latest }
          - { name: Linux GCC,    os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl-dev

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel

      - name: Test
        run: ctest --preset dev

  # Installs the core library and builds a separate project against it with find_package().
  package:
    name: Install + find_package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and install RatUI
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/install"

      - name: Build and run the consumer
        run: |
          cmake -S Tests/Package -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-consumer --parallel
          ctest --test-dir build-consumer --output-on-failure
