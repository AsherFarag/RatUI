# Builds the examples app to WebAssembly and publishes it to GitHub Pages (the README "Try Me" link).
name: Web Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          # The web preset locates the Emscripten toolchain through EMSDK.
          export EMSDK="${EMSDK:-$(dirname "$(which emcc)")/../..}"
          cmake --preset web
          cmake --build --preset web --target RatUI_Examples

      - name: Stage site
        run: |
          mkdir site
          cp build/web/Examples/RatUI_Examples.{js,wasm,data} site/
          cp build/web/Examples/RatUI_Examples.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
